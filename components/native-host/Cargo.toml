[package]
name = "codex-native-host-asm-rust-reconstruction"
version = "0.4.0-asm-rust-reconstruction"
edition = "2021"
publish = false

[lib]
name = "codex_native_host_asm_rust_reconstruction"
path = "src/lib.rs"

[[bin]]
name = "codex-native-host-reconstructed"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "net", "sync", "io-util", "fs", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
base64 = "0.22"

[features]
default = []
macos-security-framework = []
